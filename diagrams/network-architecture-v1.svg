<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <rect width="1000" height="700" fill="#fff"/>
  <text x="20" y="32" font-size="20" font-weight="bold">Retail Store - Network Architecture V1 (VirtualBox NAT, measured 17-Nov-2026)</text>

  <!-- windows host -->
  <rect x="20" y="60" width="960" height="625" rx="10" fill="#f6f6f6" stroke="#666" stroke-dasharray="8,4"/>
  <text x="35" y="82" font-weight="bold" fill="#444">Windows host (laptop)  -  physical network: home Wi-Fi / LAN</text>
  <rect x="40" y="100" width="200" height="60" rx="6" fill="#eee" stroke="#333"/><text x="140" y="125" text-anchor="middle">Browser / curl</text><text x="140" y="145" text-anchor="middle" font-size="12">on Windows</text>
  <rect x="40" y="200" width="200" height="85" rx="6" fill="#fff4e5" stroke="#c25e00"/><text x="140" y="225" text-anchor="middle" font-weight="bold">VirtualBox NAT engine</text><text x="140" y="245" text-anchor="middle" font-size="12">virtual gateway 10.0.2.2</text><text x="140" y="262" text-anchor="middle" font-size="12">DNS 49.45.0.3 (upstream)</text><text x="140" y="278" text-anchor="middle" font-size="12">port-forward rule needed</text>
  <line x1="140" y1="160" x2="140" y2="198" stroke="#333" marker-end="url(#a)"/><text x="148" y="178" font-size="11">HTTP</text><text x="148" y="192" font-size="11">localhost:8080</text>
  <line x1="40" y1="330" x2="40" y2="330"/>
  <text x="45" y="315" font-size="11" fill="#c25e00">In NAT mode Windows cannot</text><text x="45" y="329" font-size="11" fill="#c25e00">reach 10.0.2.15 directly;</text><text x="45" y="343" font-size="11" fill="#c25e00">it goes through the NAT engine</text>

  <!-- VM boundary -->
  <rect x="300" y="100" width="660" height="570" rx="10" fill="#eef5fd" stroke="#2b6cb0" stroke-width="2"/>
  <text x="315" y="124" font-weight="bold" fill="#2b6cb0">Ubuntu 26.04 VM  "Lokesh-Ubuntu"   (VM boundary)</text>
  <text x="315" y="144" font-size="12">enp0s3 10.0.2.15/24  -  default via 10.0.2.2  -  lo 127.0.0.1/8  -  docker0 172.17.0.1/16</text>
  

  <!-- app boundary -->
  <rect x="320" y="165" width="420" height="420" rx="8" fill="#ffffff" stroke="#2f855a" stroke-dasharray="6,3"/>
  <text x="335" y="185" font-size="12" font-weight="bold" fill="#2f855a">Application / service boundary (processes on the VM)</text>
  <rect x="420" y="205" width="240" height="75" rx="6" fill="#dbe9f9" stroke="#2b6cb0"/><text x="540" y="230" text-anchor="middle" font-weight="bold">UI  (java, Spring Boot/Netty)</text><text x="540" y="250" text-anchor="middle" font-size="12">listen *:8080  (0.0.0.0 / ::)</text><text x="540" y="268" text-anchor="middle" font-size="12">log ~/retail-logs/ui.log</text>
  <line x1="540" y1="280" x2="540" y2="338" stroke="#333" marker-end="url(#a)"/><text x="548" y="305" font-size="11">HTTP GET /catalog/products</text><text x="548" y="320" font-size="11">to http://localhost:8081 (loopback)</text>
  <rect x="420" y="340" width="240" height="75" rx="6" fill="#e3f4e1" stroke="#2f855a"/><text x="540" y="365" text-anchor="middle" font-weight="bold">Catalog (Go binary)</text><text x="540" y="385" text-anchor="middle" font-size="12">listen *:8081</text><text x="540" y="403" text-anchor="middle" font-size="12">log ~/retail-logs/catalog.log</text>
  <line x1="540" y1="415" x2="540" y2="473" stroke="#333" marker-end="url(#a)"/><text x="548" y="440" font-size="11">MySQL protocol to 127.0.0.1:3306</text><text x="548" y="455" font-size="11">docker-proxy -&gt; 172.17.0.2:3306</text>
  <rect x="420" y="475" width="240" height="85" rx="6" fill="#fdf2d0" stroke="#b7791f"/><text x="540" y="500" text-anchor="middle" font-weight="bold">Catalog datastore</text><text x="540" y="518" text-anchor="middle" font-size="12">MariaDB 10.9 container "catalog-db"</text><text x="540" y="535" text-anchor="middle" font-size="12">published 127.0.0.1:3306 only</text><text x="540" y="551" text-anchor="middle" font-size="12">container IP 172.17.0.2 (docker0)</text>

  <line x1="240" y1="242" x2="418" y2="242" stroke="#333" marker-end="url(#a)"/><text x="245" y="215" font-size="11">TCP to</text><text x="245" y="229" font-size="11">VM :8080</text>
  <rect x="760" y="205" width="190" height="120" rx="6" fill="#fff" stroke="#999"/><text x="852" y="225" text-anchor="middle" font-size="11" font-weight="bold">Loopback-only listeners</text><text x="852" y="245" text-anchor="middle" font-size="12">127.0.0.1:3306 (DB)</text><text x="852" y="263" text-anchor="middle" font-size="12">127.0.0.53:53 (resolver)</text><text x="852" y="281" text-anchor="middle" font-size="12">127.0.0.1:631 (cups)</text><text x="852" y="305" text-anchor="middle" font-size="11" fill="#555">bound to loopback</text>
  <rect x="760" y="345" width="190" height="105" rx="6" fill="#fff" stroke="#999"/><text x="852" y="365" text-anchor="middle" font-size="12" font-weight="bold">Name resolution</text><text x="852" y="385" text-anchor="middle" font-size="12">/etc/hosts first, then</text><text x="852" y="403" text-anchor="middle" font-size="11">systemd-resolved 127.0.0.53</text><text x="852" y="421" text-anchor="middle" font-size="12">-&gt; 49.45.0.3 via 10.0.2.2</text>

  <g font-size="11"><text x="320" y="600">Protocols: client-&gt;UI HTTP/1.1 over TCP;  UI-&gt;Catalog HTTP REST/JSON over TCP (loopback);</text>
  <text x="320" y="616">Catalog-&gt;DB MySQL wire protocol over TCP.   Ports: UI 8080, Catalog 8081, DB 3306 (loopback only).</text>
  <text x="320" y="636">Leaving the VM: any destination outside 10.0.2.0/24 and 172.17.0.0/16 goes</text>
  <text x="320" y="652">enp0s3 -&gt; default gateway 10.0.2.2 (VirtualBox NAT) -&gt; Windows network -&gt; Internet.</text></g>
</svg>
